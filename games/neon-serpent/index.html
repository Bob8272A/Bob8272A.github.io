<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>Neon Serpent</title>
</head>
<body>
<script src="../../assets/kit.js"></script>
<script>
(function () {
const N = 24, C = 20; let body, dir, next, food, acc, spd;
function place(){ do { food = {x:Kit.irnd(N), y:Kit.irnd(N)}; } while (body.some(b=>b.x===food.x&&b.y===food.y)); }
function turn(d){ const m={up:[0,-1],down:[0,1],left:[-1,0],right:[1,0]}[d]; if (m && !(m[0]===-dir[0] && m[1]===-dir[1])) next = m; }
Kit.game({ id:'neon-serpent', title:'Neon Serpent', w:480, h:480, help:'Arrow keys, WASD or swipe to steer. Eat the dots and do not hit the walls or yourself.',
  start(){ body=[{x:8,y:12},{x:7,y:12},{x:6,y:12}]; dir=[1,0]; next=dir; acc=0; spd=8; place(); },
  key(c){ turn({ArrowUp:'up',KeyW:'up',ArrowDown:'down',KeyS:'down',ArrowLeft:'left',KeyA:'left',ArrowRight:'right',KeyD:'right'}[c]); },
  swipe(d){ turn(d); },
  update(dt,g){ acc += dt*spd; while (acc >= 1 && g.playing) { acc--; dir = next;
      const h = {x:body[0].x+dir[0], y:body[0].y+dir[1]};
      if (h.x<0||h.y<0||h.x>=N||h.y>=N||body.some(b=>b.x===h.x&&b.y===h.y)) { g.beep(110,.4,'sawtooth'); return g.over(); }
      body.unshift(h);
      if (h.x===food.x&&h.y===food.y) { g.score+=10; spd=Math.min(18,spd+.25); g.beep(880,.07); g.burst(food.x*C+C/2,food.y*C+C/2,'#ff8a7a',10); place(); } else body.pop(); } },
  draw(c,g){ for(let i=0;i<N;i++)for(let j=0;j<N;j++){ c.fillStyle=(i+j)%2?'#12301f':'#0f2a1b'; c.fillRect(i*C,j*C,C,C); }
    c.strokeStyle='#3fb374'; c.lineWidth=4; c.strokeRect(2,2,476,476);
    const fx=food.x*C+C/2, fy=food.y*C+C/2, pb=1+Math.sin(g.t*6)*.08; c.fillStyle='rgba(0,0,0,.3)'; c.beginPath(); c.ellipse(fx+2,fy+7,7,3,0,0,7); c.fill();
    c.fillStyle=Kit.rgrad(c,fx-3,fy-3,10,'#ff8a7a','#d92b20'); c.beginPath(); c.arc(fx,fy+1,7.500*pb,0,7); c.fill(); c.strokeStyle='#5a3a1c'; c.lineWidth=2; c.beginPath(); c.moveTo(fx,fy-5); c.lineTo(fx+1,fy-10); c.stroke(); c.fillStyle='#49b06c'; c.beginPath(); c.ellipse(fx+5,fy-9,4,2,-.5,0,7); c.fill();
    c.lineCap='round'; c.lineJoin='round'; const P=body.map(b=>[b.x*C+C/2,b.y*C+C/2]);
    c.strokeStyle='rgba(0,0,0,.3)'; c.lineWidth=16; c.beginPath(); P.forEach((q,i)=>c[i?'lineTo':'moveTo'](q[0]+2,q[1]+3)); c.stroke();
    c.shadowColor='#5dffa0'; c.shadowBlur=10; c.strokeStyle='#2fae6a'; c.lineWidth=16; c.beginPath(); P.forEach((q,i)=>c[i?'lineTo':'moveTo'](q[0],q[1])); c.stroke(); c.shadowBlur=0;
    c.strokeStyle='#7df0b0'; c.lineWidth=7; c.beginPath(); P.forEach((q,i)=>c[i?'lineTo':'moveTo'](q[0],q[1])); c.stroke();
    c.fillStyle='#1f8a50'; P.forEach((q,i)=>{ if(i&&i%2===0){ c.beginPath(); c.arc(q[0],q[1],2.500,0,7); c.fill(); } });
    const [hx,hy]=P[0], a=Math.atan2(dir[1],dir[0]); c.save(); c.translate(hx,hy); c.rotate(a);
    if(Math.sin(g.t*8)>0){ c.strokeStyle='#ff5a6a'; c.lineWidth=2; c.beginPath(); c.moveTo(9,0); c.lineTo(15,0); c.lineTo(18,-3); c.moveTo(15,0); c.lineTo(18,3); c.stroke(); }
    c.fillStyle='#39c47c'; c.beginPath(); c.ellipse(1,0,11,9.500,0,0,7); c.fill(); c.fillStyle='#fff'; c.beginPath(); c.arc(3,-5,3.600,0,7); c.arc(3,5,3.600,0,7); c.fill(); c.fillStyle='#0b1a12'; c.beginPath(); c.arc(4.200,-5,1.800,0,7); c.arc(4.200,5,1.800,0,7); c.fill(); c.restore(); }
});
})();
</script>
</body>
</html>
