<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>Rock Field</title>
</head>
<body>
<script src="../../assets/kit.js"></script>
<script>
(function () {
const MODE={easy:.75,normal:1,hard:1.3};
let s, rocks, shots, eshots, ufo, ufoT, pups, cool, wave, inv, lives, triple, rapid, shield, deadT, nextLife;
const wrap=(o)=>{ o.x=(o.x+640)%640; o.y=(o.y+480)%480; };
function rock(x,y,sz,m){ const a=Kit.rnd(6.283), v=Kit.rnd(28,64)*(4-sz)*.7*m, pts=[]; for(let i=0;i<10;i++) pts.push(Kit.rnd(.74,1.16)); return {x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v,sz,r:sz*14,pts,rot:Kit.rnd(6),vr:Kit.rnd(-1,1),hue:Kit.irnd(3)}; }
function spawn(n,g){ for(let i=0;i<n;i++){ let x,y; do{ x=Kit.rnd(640); y=Kit.rnd(480);}while(Math.hypot(x-s.x,y-s.y)<170); rocks.push(rock(x,y,3,MODE[g.mode])); } }
function respawn(){ s={x:320,y:240,vx:0,vy:0,a:-Math.PI/2,th:false}; inv=2.5; }
function kill(g){ if(inv>0||deadT>0) return; if(shield){ shield=false; inv=1; g.sfx('hit'); g.burst(s.x,s.y,'#7fd0ff',20,220); g.pop(s.x,s.y-24,'Shield down','#7fd0ff'); return; }
  lives--; deadT=1.3; triple=rapid=0; g.sfx('boom'); g.shake(16); g.burst(s.x,s.y,['#f08a52','#fff3b0','#aab6c4'],36,260); }
function drawShip(c,g,x,y,a,th,alpha){ c.save(); c.translate(x,y); c.rotate(a); c.globalAlpha=alpha;
  if(th){ c.fillStyle=Kit.grad(c,-8,0,-30,0,'#fff3b0','#f08a52','rgba(226,54,44,0)'); c.beginPath(); c.moveTo(-8,-5); c.lineTo(-18-Math.random()*14,0); c.lineTo(-8,5); c.fill(); }
  c.fillStyle='#8a97a6'; c.beginPath(); c.moveTo(-4,-6); c.lineTo(-13,-13); c.lineTo(-10,-3); c.fill(); c.beginPath(); c.moveTo(-4,6); c.lineTo(-13,13); c.lineTo(-10,3); c.fill();
  c.fillStyle=Kit.grad(c,0,-9,0,9,'#f3f6fa','#aab6c4'); c.beginPath(); c.moveTo(17,0); c.quadraticCurveTo(2,-10,-10,-7); c.lineTo(-7,0); c.lineTo(-10,7); c.quadraticCurveTo(2,10,17,0); c.fill();
  c.fillStyle='#e2362c'; c.fillRect(-9,-7,4,14); c.fillStyle='#4fc3f7'; c.beginPath(); c.ellipse(5,0,5,3,0,0,7); c.fill(); c.fillStyle='rgba(255,255,255,.7)'; c.beginPath(); c.ellipse(6,-1,2,1,0,0,7); c.fill(); c.restore(); c.globalAlpha=1; }
Kit.game({ id:'rock-field', title:'Rock Field', w:640, h:480, pad:'lr', btns:[['ArrowUp','THRUST'],['Space','FIRE']],
  modes:[['normal','Normal'],['easy','Easy'],['hard','Hard']],
  help:'Blast drifting rocks into gravel without getting hit. Saucers hunt you from wave 2 and drop power-ups: triple shot, rapid fire and shields. Extra ship every 5,000 points.',
  keys:[['Turn','← → / A D'],['Thrust','↑ / W'],['Fire','Space'],['Pause','P or Esc']],
  start(g){ rocks=[]; shots=[]; eshots=[]; pups=[]; ufo=null; ufoT=14; cool=0; wave=1; lives=3; triple=rapid=0; shield=false; deadT=0; nextLife=5000; respawn(); spawn(4,g); },
  update(dt,g){ const m=MODE[g.mode]; g.stats=[['Wave',wave]];
    for(const r of rocks){ r.x+=r.vx*dt; r.y+=r.vy*dt; r.rot+=r.vr*dt; wrap(r); }
    for(const b of shots){ b.x+=b.vx*dt; b.y+=b.vy*dt; b.l-=dt; wrap(b); } for(const b of eshots){ b.x+=b.vx*dt; b.y+=b.vy*dt; b.l-=dt; }
    for(const p of pups){ p.l-=dt; p.y+=12*dt; }
    if(deadT>0){ deadT-=dt; if(deadT<=0){ if(lives<=0) return g.over(); respawn(); } }
    else { if(g.left) s.a-=4.2*dt; if(g.right) s.a+=4.2*dt; s.th=g.up; if(s.th){ s.vx+=Math.cos(s.a)*270*dt; s.vy+=Math.sin(s.a)*270*dt; if(Math.random()<.5) g.burst(s.x-Math.cos(s.a)*12,s.y-Math.sin(s.a)*12,'#f08a52',1,40,{grav:0,life:.25}); }
      s.vx*=1-.45*dt; s.vy*=1-.45*dt; s.x+=s.vx*dt; s.y+=s.vy*dt; wrap(s); cool-=dt; inv-=dt; triple-=dt; rapid-=dt;
      if(g.key('Space','KeyX')&&cool<=0){ cool=rapid>0?.1:.2; for(const da of triple>0?[-.18,0,.18]:[0]){ const a=s.a+da; shots.push({x:s.x+Math.cos(a)*14,y:s.y+Math.sin(a)*14,vx:Math.cos(a)*540+s.vx,vy:Math.sin(a)*540+s.vy,l:.85}); } g.sfx('shoot'); } }
    ufoT-=dt; if(!ufo&&ufoT<=0&&wave>=2){ const d=Math.random()<.5?1:-1; ufo={x:d>0?-30:670,y:Kit.rnd(60,420),vx:d*Kit.rnd(70,110)*m,ph:0,cd:1.4,hp:2}; g.sfx('whoosh'); }
    if(ufo){ ufo.x+=ufo.vx*dt; ufo.ph+=dt; ufo.y+=Math.sin(ufo.ph*2)*40*dt; ufo.cd-=dt;
      if(ufo.cd<=0&&deadT<=0){ ufo.cd=Math.max(.8,1.9-wave*.08)/m; const a=Math.atan2(s.y-ufo.y,s.x-ufo.x)+Kit.rnd(-.25,.25); eshots.push({x:ufo.x,y:ufo.y,vx:Math.cos(a)*230,vy:Math.sin(a)*230,l:2.6}); g.tone(300,160,.12,'square',.04); }
      for(const b of shots) if(b.l>0&&Math.hypot(b.x-ufo.x,b.y-ufo.y)<22){ b.l=0; ufo.hp--; g.sfx('hit'); g.burst(ufo.x,ufo.y,'#b7ff6a',8); if(ufo.hp<=0){ g.score+=300; g.sfx('boom'); g.shake(8); g.burst(ufo.x,ufo.y,['#b7ff6a','#fff3b0','#8a97a6'],30,240); g.pop(ufo.x,ufo.y-20,'+300','#b7ff6a'); pups.push({x:ufo.x,y:ufo.y,t:Kit.pick(['triple','rapid','shield']),l:9}); ufo=null; ufoT=Kit.rnd(14,22); break; } }
      if(ufo&&deadT<=0&&Math.hypot(s.x-ufo.x,s.y-ufo.y)<28) kill(g); if(ufo&&(ufo.x<-50||ufo.x>690)){ ufo=null; ufoT=Kit.rnd(10,18); } }
    for(const r of rocks){ for(const b of shots) if(b.l>0&&Math.hypot(b.x-r.x,b.y-r.y)<r.r){ b.l=0; r.dead=true; const pts=(4-r.sz)*20; g.score+=pts; g.sfx(r.sz>1?'thud':'hit'); g.burst(r.x,r.y,['#c9bfb2','#8a8076'],6+r.sz*4,150); g.shake(r.sz*1.5); g.pop(r.x,r.y,'+'+pts,'#f3f2ec',12);
          if(r.sz>1){ rocks.push(rock(r.x,r.y,r.sz-1,m),rock(r.x,r.y,r.sz-1,m)); } else if(Math.random()<.05) pups.push({x:r.x,y:r.y,t:Kit.pick(['triple','rapid','shield']),l:8}); break; }
      if(!r.dead&&deadT<=0&&Math.hypot(s.x-r.x,s.y-r.y)<r.r+8) kill(g); }
    for(const b of eshots) if(deadT<=0&&b.l>0&&Math.hypot(b.x-s.x,b.y-s.y)<11){ b.l=0; kill(g); }
    for(const p of pups) if(deadT<=0&&Math.hypot(p.x-s.x,p.y-s.y)<24){ p.l=0; g.sfx('power'); if(p.t==='triple'){ triple=12; g.pop(p.x,p.y-16,'TRIPLE SHOT','#f5b524'); } else if(p.t==='rapid'){ rapid=10; g.pop(p.x,p.y-16,'RAPID FIRE','#ff8a52'); } else { shield=true; g.pop(p.x,p.y-16,'SHIELD','#7fd0ff'); } }
    rocks=rocks.filter((r)=>!r.dead); shots=shots.filter((b)=>b.l>0); eshots=eshots.filter((b)=>b.l>0&&b.x>-10&&b.x<650&&b.y>-10&&b.y<490); pups=pups.filter((p)=>p.l>0);
    if(g.score>=nextLife){ nextLife+=5000; lives=Math.min(5,lives+1); g.sfx('power'); g.banner('Extra ship!','',1); }
    if(!rocks.length){ wave++; g.score+=100; inv=Math.max(inv,1.5); g.sfx('level'); g.banner('Wave '+wave,'Bonus +100',1.3); spawn(Math.min(9,3+wave),g); } },
  draw(c,g){ c.fillStyle=Kit.rgrad(c,420,140,460,'#1b1840','#0b0f1c','#05070c'); c.fillRect(0,0,640,480); Kit.stars(c,640,480,g.t*.15,90);
    c.fillStyle=Kit.rgrad(c,95,380,60,'#7a4fd0','#3a2470'); c.beginPath(); c.arc(100,385,46,0,7); c.fill(); c.fillStyle='rgba(0,0,0,.18)'; c.beginPath(); c.arc(114,372,10,0,7); c.arc(86,400,7,0,7); c.fill(); c.strokeStyle='rgba(200,170,255,.5)'; c.lineWidth=3; c.beginPath(); c.ellipse(100,385,70,14,-.35,0,7); c.stroke();
    for(const r of rocks){ c.save(); c.translate(r.x,r.y); c.rotate(r.rot); c.beginPath(); r.pts.forEach((p,i)=>{ const a=i/10*6.283; c[i?'lineTo':'moveTo'](Math.cos(a)*r.r*p,Math.sin(a)*r.r*p); }); c.closePath();
      const pal=[['#9a8f84','#5a5048','#2e2824'],['#8a94a0','#4a5460','#262c34'],['#a08a70','#62503c','#32281c']][r.hue]; c.fillStyle=Kit.rgrad(c,-r.r*.3,-r.r*.3,r.r*1.4,pal[0],pal[1],pal[2]); c.fill(); c.strokeStyle='rgba(230,220,205,.8)'; c.lineWidth=1.5; c.stroke();
      c.fillStyle='rgba(0,0,0,.28)'; c.beginPath(); c.arc(r.r*.25,r.r*.1,r.r*.2,0,7); c.arc(-r.r*.3,r.r*.3,r.r*.13,0,7); c.arc(-r.r*.1,-r.r*.38,r.r*.1,0,7); c.fill(); c.fillStyle='rgba(255,255,255,.12)'; c.beginPath(); c.arc(r.r*.22,r.r*.06,r.r*.2,3.6,5.6); c.fill(); c.restore(); }
    for(const p of pups){ const col=p.t==='triple'?'#f5b524':p.t==='rapid'?'#ff8a52':'#7fd0ff'; if(p.l<2&&Math.sin(g.t*20)>0) continue; c.fillStyle=col+'44'; c.beginPath(); c.arc(p.x,p.y,16+Math.sin(g.t*6)*2,0,7); c.fill(); c.fillStyle=col; c.beginPath(); c.arc(p.x,p.y,10,0,7); c.fill(); Kit.text(c,p.t==='triple'?'3':p.t==='rapid'?'R':'S',p.x,p.y+5,12,'#10131a','center'); }
    c.shadowColor='#7ef'; c.shadowBlur=10; for(const b of shots){ c.fillStyle='#bff6ff'; c.beginPath(); c.arc(b.x,b.y,3,0,7); c.fill(); } c.shadowColor='#f55'; for(const b of eshots){ c.fillStyle='#ff9a8a'; c.beginPath(); c.arc(b.x,b.y,4,0,7); c.fill(); } c.shadowBlur=0;
    if(ufo){ c.save(); c.translate(ufo.x,ufo.y); c.fillStyle='rgba(183,255,106,.18)'; c.beginPath(); c.ellipse(0,4,34,12,0,0,7); c.fill(); c.fillStyle=Kit.grad(c,0,-4,0,10,'#c9d2da','#6f7a84'); c.beginPath(); c.ellipse(0,3,26,9,0,0,7); c.fill(); c.fillStyle=Kit.rgrad(c,-3,-8,14,'#e8ffd0','#7fd04a'); c.beginPath(); c.arc(0,-2,11,Math.PI,0); c.fill();
      for(let i=-2;i<=2;i++){ c.fillStyle=Math.sin(g.t*10+i)>0?'#fff3b0':'#e2362c'; c.beginPath(); c.arc(i*9,6,2,0,7); c.fill(); } c.restore(); }
    if(deadT<=0){ drawShip(c,g,s.x,s.y,s.a,s.th,inv>0?(.45+.3*Math.sin(g.t*20)):1); if(shield){ c.strokeStyle='rgba(127,208,255,.9)'; c.lineWidth=2; c.fillStyle='rgba(127,208,255,.12)'; c.beginPath(); c.arc(s.x,s.y,22,0,7); c.fill(); c.stroke(); } }
    for(let i=0;i<lives;i++) drawShip(c,g,22+i*24,26,-Math.PI/2,false,.9); Kit.text(c,'WAVE '+wave,628,30,14,'#a7b1b8','right');
    if(triple>0) Kit.bar(c,250,14,60,8,triple/12,'#f5b524'); if(rapid>0) Kit.bar(c,330,14,60,8,rapid/10,'#ff8a52'); }
});
})();
</script>
</body>
</html>
