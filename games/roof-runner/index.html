<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>Roof Runner</title>
</head>
<body>
<script src="../../assets/kit.js"></script>
<script>
(function () {
const X=130, MODE={easy:[270,4,520],normal:[310,6,640],hard:[360,9,760]};
let y, vy, onG, jumps, slide, roofs, birds, speed, dist, coins, deadT, runT, landT;
function jump(g){ if(deadT>0) return; if(jumps<2){ vy=jumps?-500:-580; jumps++; onG=false; slide=0; g.sfx('jump'); if(jumps===2) g.burst(X,y,'#f3f2ec',6,60,{grav:0,life:.25}); } }
function mkRoof(prev,first){ const gap=first?0:Kit.rnd(80,96+speed*.24), w=Kit.rnd(240,520), ry=first?290:Kit.clamp(prev.y+Kit.rnd(-74,70),180,340), r={x:first?0:prev.x+prev.w+gap,w:first?760:w,y:ry,obs:[],coins:[],k:Kit.irnd(3)};
  if(!first){ let dx=130; while(dx<r.w-110){ if(Math.random()<.62){ const t=Kit.pick(['crate','vent','bar','crate','bar']); r.obs.push({dx,t}); if(t==='bar') for(let i=0;i<3;i++) r.coins.push({dx:dx-26+i*26,dy:-14}); else for(let i=0;i<3;i++) r.coins.push({dx:dx-30+i*30,dy:-70-(i===1?24:0)}); } else if(Math.random()<.6) for(let i=0;i<4;i++) r.coins.push({dx:dx+i*26,dy:-22}); dx+=Kit.rnd(210,300); }
    for(let i=0;i<4;i++) r.coins.push({dx:-gap*(i+.5)/4-0,dy:-66-Math.sin((i+.5)/4*Math.PI)*46}); }
  return r; }
function runner(c,x,fy,t,air,sl){ c.save(); c.translate(x,fy); c.fillStyle='rgba(0,0,0,.3)'; c.beginPath(); c.ellipse(0,1,13,3,0,0,7); if(!air) c.fill();
  if(sl){ c.rotate(-1.15); c.translate(-6,-6); }
  const s=air?1.1:Math.sin(t), k=air?-.9:Math.cos(t); c.translate(0,-22); c.lineCap='round';
  c.strokeStyle='#1c2430'; c.lineWidth=5; c.beginPath(); c.moveTo(-1,12); c.lineTo(-1+s*9,21-Math.max(0,s)*3); c.stroke(); c.beginPath(); c.moveTo(1,12); c.lineTo(1-s*9,21-Math.max(0,-s)*3); c.stroke();
  c.fillStyle='#e2362c'; c.beginPath(); c.roundRect(-1+s*9-3,19-Math.max(0,s)*3,8,4,2); c.roundRect(1-s*9-3,19-Math.max(0,-s)*3,8,4,2); c.fill();
  c.fillStyle='#2f6fd0'; c.beginPath(); c.roundRect(-7,-4,14,18,5); c.fill(); c.fillStyle='#244f96'; c.fillRect(-7,8,14,3); c.fillStyle='#f3f2ec'; c.fillRect(-2,-2,5,7);
  c.strokeStyle='#2f6fd0'; c.lineWidth=4; c.beginPath(); c.moveTo(0,0); c.lineTo(k*8,7); c.stroke(); c.fillStyle='#f2c9a0'; c.beginPath(); c.arc(k*8,8,2.5,0,7); c.fill();
  c.fillStyle='#f2c9a0'; c.beginPath(); c.arc(1,-11,7.5,0,7); c.fill(); c.fillStyle='#3a2414'; c.beginPath(); c.arc(0,-13,7.5,3.3,6.3); c.fill(); c.fillRect(-7,-15,5,6);
  c.fillStyle='#1b1208'; c.fillRect(4,-12,2,3); c.strokeStyle='#f5b524'; c.lineWidth=4; c.beginPath(); c.moveTo(-5,-5); c.quadraticCurveTo(-16,-6+Math.sin(t*1.3)*3,-24,-2+Math.sin(t*1.7)*5); c.stroke(); c.fillStyle='#f5b524'; c.fillRect(-6,-7,13,4); c.restore(); }
Kit.game({ id:'roof-runner', title:'Roof Runner', w:720, h:400, unit:'Score', btns:[['ArrowDown','SLIDE'],['Space','JUMP']],
  modes:[['normal','Normal'],['easy','Easy'],['hard','Hard']],
  help:'Sprint across the skyline. Hold jump to leap higher, tap again in the air for a double jump, and slide under billboards and swooping birds.',
  keys:[['Jump (hold for higher)','Space / ↑ / W / tap'],['Double jump','Jump again in the air'],['Slide / drop fast','↓ or S']],
  start(g){ y=290; vy=0; onG=true; jumps=0; slide=0; speed=MODE[g.mode][0]; dist=0; coins=0; deadT=0; runT=0; landT=0; birds=[]; roofs=[mkRoof(null,true)]; while(roofs[roofs.length-1].x<900) roofs.push(mkRoof(roofs[roofs.length-1])); },
  tap(x,yy,g){ jump(g); }, key(c,g){ if(c==='Space'||c==='ArrowUp'||c==='KeyW') jump(g); },
  update(dt,g){ const [s0,acc,max]=MODE[g.mode]; if(deadT>0){ deadT-=dt; vy+=1500*dt; y+=vy*dt; if(deadT<=0) g.over(); return; }
    speed=Math.min(max,speed+acc*dt); const d=speed*dt; dist+=d; runT+=dt*speed/26; landT-=dt;
    for(const r of roofs) r.x-=d; roofs=roofs.filter((r)=>r.x+r.w>-40); while(roofs[roofs.length-1].x+roofs[roofs.length-1].w<820) roofs.push(mkRoof(roofs[roofs.length-1]));
    if(dist>1500&&Math.random()<dt*.22&&birds.length<2) birds.push({x:760,y:0,ph:Math.random()*6});
    const hold=g.key('Space','ArrowUp','KeyW')||g.ptr.down; if(!hold&&vy<-230) vy=-230;
    const down=g.dn; if(down&&onG) slide=Math.min(.9,slide+dt); else if(!down) slide=0; if(slide>=.9&&onG) slide=.9; const sliding=down&&onG&&slide<.9;
    const py=y; vy+=(down&&!onG?3200:1500)*dt; y+=vy*dt; const was=onG; onG=false;
    for(const r of roofs){ if(X+9>r.x&&X-9<r.x+r.w){ if(py<=r.y+1&&y>=r.y&&vy>=0){ y=r.y; vy=0; onG=true; jumps=0; if(!was){ landT=.12; g.sfx('thud'); g.burst(X,y,'#c9bfb2',6,70,{grav:60,life:.3}); } }
        else if(y>r.y+10&&py>r.y+4&&X+9<r.x+16){ deadT=.8; vy=-200; g.sfx('hit'); g.shake(10); return; } }
      for(const o of r.obs){ const ox=r.x+o.dx; if(o.t==='bar'){ if(Math.abs(ox-X)<20&&!sliding&&y>r.y-60&&y-38<r.y-26){ deadT=.8; vy=-260; g.sfx('hit'); g.shake(12); g.burst(X,y-30,'#f5b524',14); return; } }
        else { const w=o.t==='crate'?14:20, h=o.t==='crate'?26:18; if(Math.abs(ox-X)<w+7&&y>r.y-h+3&&y<=r.y+2){ deadT=.8; vy=-260; g.sfx('hit'); g.shake(12); g.burst(ox,r.y-h/2,'#a8733f',14); return; } } }
      for(const k of r.coins){ if(!k.got&&Math.abs(r.x+k.dx-X)<18&&Math.abs(r.y+k.dy-(y-(sliding?8:20)))<26){ k.got=true; coins++; g.sfx('coin'); g.burst(r.x+k.dx,r.y+k.dy,'#f5c531',6,90); } } }
    for(const b of birds){ b.x-=(speed+170)*dt; const cur=roofs.find((r)=>b.x>r.x&&b.x<r.x+r.w); b.y+=((cur?cur.y:260)-40+Math.sin(g.t*5+b.ph)*5-b.y)*Math.min(1,dt*6)||0; if(!b.y) b.y=220;
      if(Math.abs(b.x-X)<18&&b.y>y-(sliding?14:40)&&b.y<y+4){ deadT=.8; vy=-260; g.sfx('hit'); g.shake(12); g.burst(b.x,b.y,'#f3f2ec',14); return; } }
    birds=birds.filter((b)=>b.x>-40);
    if(y>440){ g.sfx('whoosh'); g.shake(8); return g.over('You fell'); }
    g.score=Math.floor(dist/10)+coins*10; g.stats=[['Distance',Math.floor(dist/10)+' m'],['Coins',coins]]; },
  draw(c,g){ c.fillStyle=Kit.grad(c,0,0,0,400,'#140c2e','#3b1d54','#c2553f','#f6a35c'); c.fillRect(0,0,720,400);
    Kit.stars(c,720,170,0,36); c.fillStyle='rgba(253,233,192,.14)'; c.beginPath(); c.arc(590,78,52,0,7); c.fill(); c.fillStyle='#fde9c0'; c.beginPath(); c.arc(590,78,30,0,7); c.fill(); c.fillStyle='rgba(200,170,130,.35)'; c.beginPath(); c.arc(580,70,6,0,7); c.arc(600,88,4,0,7); c.fill();
    for(let L=0;L<2;L++){ const sp=L?.35:.15; for(let i=0;i<9;i++){ const w=L?92:120, x=((i*(L?128:170)-dist*sp)%1152+1152)%1152-160, h=(L?130:190)+((i*67+L*31)%90); c.fillStyle=L?'rgba(22,14,40,.78)':'rgba(60,30,80,.55)'; c.fillRect(x,400-h,w,h);
        if(L){ c.fillStyle='rgba(255,214,130,.55)'; for(let wy=400-h+12;wy<400;wy+=22) for(let wx=x+10;wx<x+w-10;wx+=18) if((Math.floor(wx-x)*7+wy*3+i)%5<2) c.fillRect(wx,wy,7,9); } } }
    for(const r of roofs){ c.fillStyle='#10151c'; c.fillRect(r.x,r.y,r.w,400); c.fillStyle='#1a222c'; c.fillRect(r.x,r.y,r.w,10); c.fillStyle='#f5b524'; c.fillRect(r.x,r.y,r.w,3); c.fillStyle='#0b0f14'; c.fillRect(r.x-3,r.y+10,r.w+6,5);
      for(let wx=14;wx<r.w-22;wx+=30) for(let wy=r.y+28;wy<400;wy+=32){ const lit=((wx*13+Math.floor(wy)*7+Math.floor(r.w))%7)<3; c.fillStyle=lit?'#ffd27a':'#232e3a'; c.fillRect(r.x+wx,wy,14,16); if(lit){ c.fillStyle='rgba(0,0,0,.25)'; c.fillRect(r.x+wx+6,wy,2,16); } }
      if(r.w>300&&!r.obs.some((o)=>Math.abs(o.dx-r.w*.5)<70)){ const ax=r.x+r.w*.5;
        if(r.k===0){ c.fillStyle='#39434e'; c.fillRect(ax,r.y-46,3,46); c.fillRect(ax-8,r.y-36,19,2); c.fillStyle='#e2362c'; c.beginPath(); c.arc(ax+1.5,r.y-48,3+Math.sin(g.t*6),0,7); c.fill(); }
        else if(r.k===1){ c.fillStyle='#4a3a2c'; c.fillRect(ax-2,r.y-12,3,12); c.fillRect(ax+22,r.y-12,3,12); c.fillStyle='#6b523b'; c.beginPath(); c.roundRect(ax-8,r.y-40,38,30,4); c.fill(); c.fillStyle='#57422f'; c.fillRect(ax-8,r.y-30,38,3); c.fillStyle='#6b523b'; c.beginPath(); c.moveTo(ax-10,r.y-40); c.lineTo(ax+11,r.y-52); c.lineTo(ax+32,r.y-40); c.fill(); } }
      for(const o of r.obs){ const ox=r.x+o.dx, oy=r.y;
        if(o.t==='crate'){ c.fillStyle='#a8733f'; c.fillRect(ox-14,oy-26,28,26); c.strokeStyle='#6f4623'; c.lineWidth=2; c.strokeRect(ox-13,oy-25,26,24); c.beginPath(); c.moveTo(ox-13,oy-25); c.lineTo(ox+13,oy-1); c.moveTo(ox+13,oy-25); c.lineTo(ox-13,oy-1); c.stroke(); }
        else if(o.t==='vent'){ c.fillStyle='#8a939a'; c.beginPath(); c.roundRect(ox-20,oy-18,40,18,3); c.fill(); c.fillStyle='#565e66'; for(let i=0;i<5;i++) c.fillRect(ox-16+i*7,oy-14,3,10); c.fillStyle='rgba(255,255,255,.25)'; c.fillRect(ox-20,oy-18,40,2); const a=g.t*2+o.dx; c.fillStyle='rgba(255,255,255,.12)'; c.beginPath(); c.arc(ox+Math.sin(a)*4,oy-30-((g.t*20+o.dx)%20),7,0,7); c.fill(); }
        else { c.fillStyle='#39434e'; c.fillRect(ox-22,oy-66,4,66); c.fillRect(ox+18,oy-66,4,66); c.fillStyle='#e2362c'; c.beginPath(); c.roundRect(ox-30,oy-70,60,42,4); c.fill(); c.fillStyle='#f3f2ec'; c.beginPath(); c.roundRect(ox-26,oy-66,52,34,3); c.fill(); Kit.text(c,'DUCK',ox,oy-43,14,'#e2362c','center'); c.fillStyle='#f5b524'; for(let i=0;i<5;i++){ c.beginPath(); c.arc(ox-24+i*12,oy-28,2,0,7); c.fill(); } } }
      for(const k of r.coins) if(!k.got) Kit.coin(c,r.x+k.dx,r.y+k.dy,7,g.t+k.dx*.02); }
    for(const b of birds){ const w=Math.sin(g.t*16+b.ph)*9; c.fillStyle='#f3f2ec'; c.beginPath(); c.ellipse(b.x,b.y,11,5,0,0,7); c.fill(); c.beginPath(); c.moveTo(b.x-2,b.y); c.lineTo(b.x+6,b.y-w-4); c.lineTo(b.x+10,b.y); c.fill(); c.fillStyle='#f5b524'; c.beginPath(); c.moveTo(b.x-11,b.y-1); c.lineTo(b.x-18,b.y+1); c.lineTo(b.x-11,b.y+3); c.fill(); c.fillStyle='#1b1208'; c.fillRect(b.x-8,b.y-2,2,2); }
    const sliding=g.dn&&onG&&slide<.9&&deadT<=0; if(onG&&deadT<=0&&g.playing&&Math.random()<.3) g.burst(X-8,y,'rgba(200,190,180,.5)',1,30,{grav:-40,life:.25});
    c.save(); if(deadT>0){ c.translate(X,y-20); c.rotate((.8-deadT)*7); c.translate(-X,-(y-20)); } runner(c,X,y+(landT>0?2:0),runT,!onG,sliding); c.restore();
    Kit.coin(c,22,22,9,0); Kit.text(c,''+coins,38,28,16,'#f5c531'); Kit.text(c,Math.floor(dist/10)+' m',708,28,16,'#f3f2ec','right'); }
});
})();
</script>
</body>
</html>
