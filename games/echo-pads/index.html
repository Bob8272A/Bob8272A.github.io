<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>Echo Pads</title>
</head>
<body>
<script src="../../assets/kit.js"></script>
<script>
(function () {
const PADS=[[40,40,'#a05fd0',330],[250,40,'#2fb3a0',415],[40,250,'#f08a52',495],[250,250,'#e85a9a',660]], KEYS=['Digit1','Digit2','Digit3','Digit4','KeyQ','KeyW','KeyA','KeyS'];
let seq, pos, phase, t, lit, litT, lives, press, wrongT;
function flash(i,g,len){ lit=i; litT=len||.3; g.tone(PADS[i][3],0,len?len+.05:.3,'triangle',.1); g.tone(PADS[i][3]*2,0,.12,'sine',.03); }
function want(g){ return g.mode==='reverse'?seq[seq.length-1-pos]:seq[pos]; }
function hit(i,g){ if(phase!=='you'||i<0) return; press=i; flash(i,g);
  if(i!==want(g)){ lives--; wrongT=.8; g.sfx('bad'); g.shake(8); if(lives<=0) return g.over('Out of tries'); phase='wait'; t=1.1; pos=0; g.pop(240,130,'Watch again','#ff8a7a',16); return; }
  pos++; g.burst(PADS[i][0]+95,PADS[i][1]+95,PADS[i][2],6,120); if(pos===seq.length){ g.score=seq.length; g.sfx('good'); g.pop(240,130,'Round '+seq.length+' clear','#fff3b0',16); seq.push(Kit.irnd(4)); phase='wait'; pos=0; t=1; } }
Kit.game({ id:'echo-pads', title:'Echo Pads', w:480, h:480, unit:'Rounds',
  modes:[['classic','Classic'],['fast','Fast'],['reverse','Reverse']],
  help:'Watch the pads light up, then repeat the pattern. It grows by one every round. You get three tries: a wrong pad replays the pattern. In Reverse you play it back to front.',
  keys:[['Press a pad','Click, or 1 2 3 4, or Q W A S'],['Pause','P or Esc']],
  start(g){ seq=[Kit.irnd(4)]; pos=0; phase='wait'; t=.9; lit=-1; litT=0; lives=3; press=-1; wrongT=0; },
  tap(x,y,g){ hit(PADS.findIndex((p)=>x>p[0]&&x<p[0]+190&&y>p[1]&&y<p[1]+190),g); },
  key(c,g){ const i=KEYS.indexOf(c); if(i>=0) hit(i%4,g); },
  update(dt,g){ litT-=dt; wrongT-=dt; if(litT<=0) lit=-1; const gap=g.mode==='fast'?Math.max(.16,.3-seq.length*.01):Math.max(.3,.62-seq.length*.02);
    if(phase==='wait'){ t-=dt; if(t<=0){ phase='show'; pos=0; t=0; } }
    else if(phase==='show'){ t-=dt; if(t<=0){ if(pos<seq.length){ flash(seq[pos++],g,gap*.75); t=gap; } else { phase='you'; pos=0; } } }
    g.stats=[['Longest pattern',seq.length-1]]; },
  draw(c,g){ c.fillStyle=Kit.rgrad(c,240,240,340,'#232a36','#0b0f14'); c.fillRect(0,0,480,480); c.fillStyle='#14181f'; c.beginPath(); c.roundRect(22,22,436,436,34); c.fill(); c.strokeStyle=wrongT>0?'#e2362c':'#3a424e'; c.lineWidth=4; c.beginPath(); c.roundRect(22,22,436,436,34); c.stroke();
    PADS.forEach((p,i)=>{ const on=lit===i, x=p[0], y=p[1], d=on?3:0;
      if(on){ c.shadowColor=p[2]; c.shadowBlur=44; } c.fillStyle='rgba(0,0,0,.5)'; c.beginPath(); c.roundRect(x+3,y+7,190,190,26); c.fill();
      c.globalAlpha=on?1:.4; c.fillStyle=p[2]; c.beginPath(); c.roundRect(x,y+d,190,190,26); c.fill(); c.shadowBlur=0; c.globalAlpha=1;
      c.fillStyle=Kit.grad(c,0,y,0,y+190,'rgba(255,255,255,'+(on?.55:.16)+')','rgba(255,255,255,0)','rgba(0,0,0,.25)'); c.beginPath(); c.roundRect(x,y+d,190,190,26); c.fill();
      const kx=x+32, ky=y+32+d; c.fillStyle='rgba(11,15,20,.55)'; c.beginPath(); c.arc(kx,ky,15,0,7); c.fill(); Kit.text(c,''+(i+1),kx,ky+6,16,'#f3f2ec','center');
      c.fillStyle='rgba(255,255,255,'+(on?.9:.3)+')'; const mx=x+95,my=y+104+d, D=[[[0,0]],[[-20,0],[20,0]],[[0,-18],[-20,16],[20,16]],[[-18,-18],[18,-18],[-18,18],[18,18]]][i]; for(const [dx,dy] of D){ c.beginPath(); c.arc(mx+dx,my+dy,11,0,7); c.fill(); } });
    c.fillStyle='#0b0f14'; c.beginPath(); c.roundRect(150,214,180,52,26); c.fill(); c.strokeStyle=phase==='you'?'#3fb374':'#f5b524'; c.lineWidth=3; c.beginPath(); c.roundRect(150,214,180,52,26); c.stroke();
    Kit.text(c,phase==='you'?(g.mode==='reverse'?'YOUR TURN (REVERSED)':'YOUR TURN'):'WATCH',240,237,g.mode==='reverse'&&phase==='you'?11:14,'#f3f2ec','center');
    const n=seq.length, w=Math.min(8,150/n); for(let i=0;i<n;i++){ c.fillStyle=phase==='you'&&i<pos?'#3fb374':phase==='show'&&i<pos?'#f5b524':'rgba(255,255,255,.2)'; c.beginPath(); c.arc(240-(n-1)*w/2+i*w,253,Math.min(3,w/2.4),0,7); c.fill(); }
    Kit.hearts(c,202,468,lives,3); }
});
})();
</script>
</body>
</html>
