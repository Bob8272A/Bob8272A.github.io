<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>Rush Crossing</title>
</head>
<body>
<script src="../../assets/kit.js"></script>
<script>
(function () {
const T=40, COLS=12, ROWS=15, OY=40, SPD={easy:.72,normal:1,hard:1.3};
let p, lanes, coins, lives, level, timer, far, dead, why, got;
const isGrass=(r)=>r===0||r===7||r===ROWS-1;
const laneAt=(r)=>lanes.find((l)=>l.r===r);
const sx=(it)=>it.x-it.w;                       // left edge on screen
function build(g){ const m=SPD[g.mode]*(1+(level-1)*.1); lanes=[]; coins=[];
  for(let r=1;r<ROWS-1;r++){ if(r===7) continue; const upper=r<7, dir=r%2?1:-1;
    if(!upper&&level>=3&&r===10){ lanes.push({r,type:'rail',dir:1,sp:560*m,items:[{x:Kit.rnd(600,1200),w:430}],span:480+430+Kit.rnd(1100,1700)}); continue; }
    if(upper&&level>=2){ const w=Kit.pick([84,120,160]), n=w>130?2:3, span=Math.max(540,n*(w+96)), items=[]; for(let i=0;i<n;i++) items.push({x:i*span/n+Kit.rnd(0,24),w,pad:w===84}); lanes.push({r,type:'river',dir,sp:Kit.rnd(34,58)*m,items,span}); continue; }
    const w=Kit.pick([56,56,56,92,124]), n=Kit.irnd(2,w>90?3:4), span=480+w+60, items=[];
    for(let i=0;i<n;i++) items.push({x:i*span/n+Kit.rnd(0,34),w,hue:Kit.irnd(360),kind:w===56?Kit.pick(['car','car','taxi','police']):w===92?Kit.pick(['truck','van']):'bus'});
    lanes.push({r,type:'road',dir,sp:(Kit.rnd(46,80)+(r%3===0?36:0))*m,items,span}); }
  const spots=[2,3,4,5,7,9,11,12]; for(let i=0;i<5;i++) coins.push({c:Kit.irnd(COLS),r:Kit.pick(spots)}); }
function spawn(){ p={x:6*T+20,r:ROWS-1,fx:6*T+20,fr:ROWS-1,hop:0,face:0}; far=ROWS-1; timer=40; }
function mv(dx,dy,g){ if(dead>0||p.hop>.45) return; const nr=Kit.clamp(p.r+dy,0,ROWS-1); let nx=Kit.clamp(p.x+dx*T,20,460); const l=laneAt(nr);
  if(!l||l.type!=='river') nx=Math.floor(nx/T)*T+20; if(nr===p.r&&nx===p.x) return;
  p.fx=p.x; p.fr=p.r; p.x=nx; p.r=nr; p.hop=1; p.face=Math.atan2(dx,-dy); g.tone(420,560,.06,'triangle',.05);
  if(p.r<far){ far=p.r; g.score+=10; } }
function die(g,msg,col){ if(dead>0) return; lives--; dead=1.1; why=msg; g.sfx(msg==='Splash!'?'whoosh':'hit'); g.shake(10); g.burst(p.x,OY+p.r*T+20,col||'#f08a3c',22,220); g.pop(p.x,OY+p.r*T,msg,'#ff8a7a',18); }
function fox(c,x,y,ang,sc){ c.save(); c.translate(x,y); c.fillStyle='rgba(0,0,0,.3)'; c.beginPath(); c.ellipse(2,6,12,9,0,0,7); c.fill(); c.rotate(ang); c.scale(sc,sc);
  c.fillStyle='#e8762c'; c.beginPath(); c.ellipse(0,13,5,9,0,0,7); c.fill(); c.fillStyle='#fff6e8'; c.beginPath(); c.ellipse(0,19,3.5,4,0,0,7); c.fill();
  c.fillStyle='#c95f1c'; c.beginPath(); c.ellipse(-8,8,3,4,0,0,7); c.ellipse(8,8,3,4,0,0,7); c.ellipse(-8,-3,3,4,0,0,7); c.ellipse(8,-3,3,4,0,0,7); c.fill();
  c.fillStyle='#e8762c'; c.beginPath(); c.ellipse(0,3,9,11,0,0,7); c.fill(); c.fillStyle='#3b6fd4'; c.beginPath(); c.roundRect(-5,1,10,9,3); c.fill(); c.fillStyle='#2a52a3'; c.fillRect(-5,4,10,2); c.fillStyle='#f5b524'; c.fillRect(-1,2,2,2);
  for(const s of [-1,1]){ c.fillStyle='#e8762c'; c.beginPath(); c.moveTo(s*9,-6); c.lineTo(s*7,-17); c.lineTo(s*2,-10); c.fill(); c.fillStyle='#2b1a10'; c.beginPath(); c.moveTo(s*7.5,-13); c.lineTo(s*7,-17); c.lineTo(s*5,-13.5); c.fill(); }
  c.fillStyle='#f08a3c'; c.beginPath(); c.arc(0,-7,8.5,0,7); c.fill(); c.fillStyle='#fff6e8'; c.beginPath(); c.ellipse(0,-13,4,4.5,0,0,7); c.fill();
  c.fillStyle='#1b1208'; c.beginPath(); c.arc(0,-16.5,1.8,0,7); c.fill(); c.beginPath(); c.arc(-4,-9,1.5,0,7); c.arc(4,-9,1.5,0,7); c.fill(); c.restore(); }
Kit.game({ id:'rush-crossing', title:'Rush Crossing', w:480, h:640, pad:'dpad',
  modes:[['normal','Normal'],['easy','Easy'],['hard','Hard']],
  help:'Guide the fox to the far side. Roads come first, then rivers you cross by riding logs, then a railway. Grab coins and beat the clock.',
  keys:[['Hop','Arrows / W A S D / swipe'],['Pause','P or Esc']],
  start(g){ lives=3; level=1; dead=0; got=0; build(g); spawn(); },
  key(c,g){ const m={ArrowUp:[0,-1],KeyW:[0,-1],ArrowDown:[0,1],KeyS:[0,1],ArrowLeft:[-1,0],KeyA:[-1,0],ArrowRight:[1,0],KeyD:[1,0]}[c]; if(m) mv(m[0],m[1],g); },
  swipe(d,g){ const m={up:[0,-1],down:[0,1],left:[-1,0],right:[1,0]}[d]; mv(m[0],m[1],g); },
  tap(x,y,g){},
  update(dt,g){ for(const l of lanes) for(const it of l.items) it.x=((it.x+l.dir*l.sp*dt)%l.span+l.span)%l.span;
    g.stats=[['Level',level],['Coins',got]];
    if(dead>0){ dead-=dt; if(dead<=0){ if(lives<=0) return g.over(why); spawn(); } return; }
    timer-=dt; if(timer<=0) return die(g,'Too slow!','#a7b1b8'); if(timer<8&&Math.floor(timer*2)!==Math.floor((timer+dt)*2)) g.sfx('tick');
    p.hop=Math.max(0,p.hop-dt*7.5); const l=laneAt(p.r);
    if(l&&(l.type==='road'||l.type==='rail')){ for(const it of l.items) if(p.x+11>sx(it)&&p.x-11<sx(it)+it.w) return die(g,l.type==='rail'?'Train!':'Bonk!'); }
    if(l&&l.type==='river'&&p.hop<=.2){ const on=l.items.find((it)=>p.x>sx(it)-6&&p.x<sx(it)+it.w+6);
      if(!on) return die(g,'Splash!','#7fd0ff'); p.x+=l.dir*l.sp*dt; if(p.x<6||p.x>474) return die(g,'Swept away!','#7fd0ff'); }
    const col=Math.floor(p.x/T); coins=coins.filter((k)=>{ if(k.c===col&&k.r===p.r){ g.score+=50; got++; g.sfx('coin'); g.pop(k.c*T+20,OY+k.r*T,'+50'); g.burst(k.c*T+20,OY+k.r*T+20,'#f5c531',10); return false; } return true; });
    if(p.r===0&&p.hop<=.2){ const bonus=100+Math.floor(timer)*5; g.score+=bonus; level++; g.sfx('level'); g.banner('Level '+level,'Time bonus +'+(bonus-100)); build(g); spawn(); } },
  draw(c,g){ c.save(); c.translate(0,OY);
    for(let r=0;r<ROWS;r++){ const l=laneAt(r), y=r*T;
      if(!l){ c.fillStyle=r%2?'#2f7d46':'#2a7440'; c.fillRect(0,y,480,T);
        for(let i=0;i<22;i++){ const x=Kit.hash(r,i)*480, yy=y+4+Kit.hash(i,r)*30; c.fillStyle='#3f9a5a'; c.fillRect(x,yy,2,5); c.fillRect(x+3,yy+1,2,4);
          if(i%5===0){ c.fillStyle=['#f5d142','#f3f2ec','#f08ab0'][i%3]; c.beginPath(); c.arc(x+10,yy+3,2.5,0,7); c.fill(); } }
        if(r===0){ for(let i=0;i<6;i++) Kit.tree(c,20+i*88,y+12,.9); Kit.text(c,'FINISH',240,y+30,15,'#f5b524','center'); } }
      else if(l.type==='river'){ c.fillStyle=Kit.grad(c,0,y,0,y+T,'#2d7fc4','#2468a8'); c.fillRect(0,y,480,T); c.strokeStyle='rgba(255,255,255,.25)'; c.lineWidth=1.5;
        for(let i=0;i<7;i++){ const x=((Kit.hash(r,i)*520+g.t*l.dir*l.sp*.6)%520+520)%520-20, yy=y+8+Kit.hash(i,r)*26; c.beginPath(); c.moveTo(x,yy); c.quadraticCurveTo(x+7,yy-3,x+14,yy); c.stroke(); } }
      else if(l.type==='rail'){ c.fillStyle='#4a4038'; c.fillRect(0,y,480,T); c.fillStyle='#6b5038'; for(let x=4;x<480;x+=18) c.fillRect(x,y+5,7,T-10); c.fillStyle='#b9c0c6'; c.fillRect(0,y+9,480,3); c.fillRect(0,y+T-12,480,3); }
      else { c.fillStyle='#2a3038'; c.fillRect(0,y,480,T); for(let i=0;i<10;i++){ c.fillStyle='rgba(255,255,255,.035)'; c.fillRect(Kit.hash(r,i)*480,y+Kit.hash(i,r)*T,10,2); } } }
    for(let r=1;r<ROWS;r++){ const a=laneAt(r-1), b=laneAt(r), ta=a?a.type:'g', tb=b?b.type:'g';
      if(ta!==tb){ c.fillStyle=(ta==='river'||tb==='river')?'#c9b98a':'#b9c0c6'; c.fillRect(0,r*T-3,480,6); }
      else if(ta==='road'){ c.fillStyle='#e9d67a'; for(let x=6;x<480;x+=44) c.fillRect(x,r*T-1.5,22,3); } }
    for(const l of lanes){ const y=l.r*T; for(const it of l.items){ const x=sx(it);
        if(l.type==='road') Kit.car(c,x+it.w/2,y+T/2,T-13,it.w-2,it.kind==='police'?'#f3f2ec':it.kind==='taxi'?'#f5c531':`hsl(${it.hue},66%,54%)`,l.dir>0?Math.PI/2:-Math.PI/2,it.kind);
        else if(l.type==='river'){ if(it.pad){ for(let k=0;k<2;k++){ const cx=x+22+k*40; c.fillStyle='#1f6b3c'; c.beginPath(); c.arc(cx,y+20,17,.4,6.1); c.lineTo(cx,y+20); c.fill(); c.fillStyle='#3fa35e'; c.beginPath(); c.arc(cx-2,y+18,11,.6,5.9); c.lineTo(cx-2,y+18); c.fill(); if(k){ c.fillStyle='#f08ab0'; c.beginPath(); c.arc(cx+3,y+16,4,0,7); c.fill(); c.fillStyle='#f5d142'; c.beginPath(); c.arc(cx+3,y+16,1.6,0,7); c.fill(); } } }
          else { c.fillStyle='rgba(0,0,0,.25)'; c.beginPath(); c.roundRect(x+2,y+9,it.w,T-12,13); c.fill(); c.fillStyle=Kit.grad(c,0,y+5,0,y+T-5,'#a8733f','#6f4623'); c.beginPath(); c.roundRect(x,y+5,it.w,T-12,13); c.fill();
            c.strokeStyle='rgba(50,28,10,.45)'; c.lineWidth=1.5; for(let k=14;k<it.w-10;k+=22){ c.beginPath(); c.moveTo(x+k,y+10); c.lineTo(x+k+8,y+11); c.moveTo(x+k+4,y+T-13); c.lineTo(x+k+13,y+T-12); c.stroke(); }
            c.fillStyle='#d9a86a'; c.beginPath(); c.ellipse(x+it.w-6,y+19,5,12,0,0,7); c.fill(); c.strokeStyle='#8a5a2c'; c.beginPath(); c.ellipse(x+it.w-6,y+19,2.5,7,0,0,7); c.stroke(); } }
        else { const cars=5; for(let k=0;k<cars;k++){ const cx=x+k*86; c.fillStyle='rgba(0,0,0,.3)'; c.fillRect(cx+3,y+7,82,T-8); c.fillStyle=k===cars-1?'#c0392b':'#3d6a8a'; c.beginPath(); c.roundRect(cx,y+4,82,T-8,k===cars-1?[4,14,14,4]:4); c.fill(); c.fillStyle='rgba(255,255,255,.2)'; c.fillRect(cx+3,y+7,76,4); c.fillStyle='#16283a'; for(let q=8;q<70;q+=16) c.fillRect(cx+q,y+15,10,10); c.fillStyle='#1b1f24'; c.fillRect(cx+82,y+17,4,6); }
          c.fillStyle='#fff2b0'; c.fillRect(x+cars*86-6,y+10,4,6); c.fillRect(x+cars*86-6,y+T-16,4,6); } }
      if(l.type==='rail'){ const it=l.items[0], warn=it.x>l.span-l.sp*1.5||(sx(it)<480&&sx(it)+it.w>0); for(const px of [6,474]){ c.fillStyle='#39434e'; c.fillRect(px-2,y-8,4,16); c.fillStyle=warn&&Math.sin(g.t*18)>0?'#ff3b30':'#5a1a16'; c.beginPath(); c.arc(px,y-10,5,0,7); c.fill(); } if(warn&&g.playing&&Math.sin(g.t*18)>.95) g.tone(880,0,.05,'square',.02); } }
    for(const k of coins) Kit.coin(c,k.c*T+20,k.r*T+20,9,g.t+k.c);
    if(dead<=0){ const e=Kit.easeOut(1-p.hop); fox(c,Kit.lerp(p.fx,p.x,e),Kit.lerp(p.fr,p.r,e)*T+20,p.face,1+Math.sin(p.hop*Math.PI)*.3); }
    c.restore();
    c.fillStyle='#11171e'; c.fillRect(0,0,480,OY); c.fillStyle='rgba(243,242,236,.12)'; c.fillRect(0,OY-1,480,1);
    Kit.hearts(c,22,20,lives,3); Kit.text(c,'LEVEL '+level,240,26,15,'#f3f2ec','center'); Kit.bar(c,330,13,136,14,timer/40,timer<8?'#e2362c':'#3fb374'); Kit.text(c,'TIME',322,25,10,'#a7b1b8','right'); }
});
})();
</script>
</body>
</html>
