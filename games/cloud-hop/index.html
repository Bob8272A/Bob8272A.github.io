<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>Cloud Hop</title>
</head>
<body>
<script src="../../assets/kit.js"></script>
<script>
(function () {
let p, plats, top, maxH;
function mk(y){ const t=Math.random(); return {x:Kit.rnd(10,330),y,w:80,type:t<.12?'move':t<.2?'frag':'ok',vx:Kit.rnd(60,120),dead:false}; }
function hopper(c,x,y,vy,vx){ const st=Kit.clamp(vy/900,-.25,.25); c.save(); c.translate(x,y); c.scale(1-st*.5,1+st*.5);
  c.fillStyle='#ffb347'; c.beginPath(); c.ellipse(-8,15,6,3.500,0,0,7); c.ellipse(8,15,6,3.500,0,0,7); c.fill();
  c.fillStyle=Kit.rgrad(c,-5,-6,22,'#8ff0c4','#2fb37c'); c.beginPath(); c.arc(0,0,16,0,7); c.fill();
  c.fillStyle='#d8fbe9'; c.beginPath(); c.ellipse(0,6,9,7,0,0,7); c.fill();
  c.fillStyle='#2fb37c'; c.beginPath(); c.moveTo(-3,-15); c.lineTo(0,-24); c.lineTo(3,-15); c.fill(); c.fillStyle='#f5b524'; c.beginPath(); c.arc(0,-25,3,0,7); c.fill();
  const lx=Kit.clamp(vx/200,-1,1)*2; c.fillStyle='#fff'; c.beginPath(); c.arc(-6,-4,5,0,7); c.arc(6,-4,5,0,7); c.fill(); c.fillStyle='#13241c'; c.beginPath(); c.arc(-6+lx,-4+(vy>0?1.500:-1),2.400,0,7); c.arc(6+lx,-4+(vy>0?1.500:-1),2.400,0,7); c.fill();
  c.strokeStyle='#13241c'; c.lineWidth=1.500; c.beginPath(); c.arc(0,3,4,.2,2.940); c.stroke(); c.restore(); }
Kit.game({ id:'cloud-hop', title:'Cloud Hop', w:420, h:640, unit:'Height', help:'Steer left and right with the arrow keys, A/D, or by holding either side of the screen. You bounce on your own. Do not fall.',
  start(){ p={x:210,y:520,vx:0,vy:-560}; plats=[{x:170,y:580,w:80,type:'ok'}]; for(let y=500;y>-700;y-=70) plats.push(mk(y)); maxH=0; top=-700; },
  update(dt,g){ let ax=0; if(g.left) ax=-1; else if(g.right) ax=1; else if(g.ptr.down) ax=g.ptr.x<210?-1:1;
    p.vx+=(ax*330-p.vx)*Math.min(1,dt*10); p.x+=p.vx*dt; if(p.x<-15)p.x=435; if(p.x>435)p.x=-15;
    const py=p.y; p.vy+=1150*dt; p.y+=p.vy*dt;
    for(const q of plats){ if(q.type==='move'){ q.x+=q.vx*dt; if(q.x<0||q.x>420-q.w) q.vx*=-1; }
      if(!q.dead&&p.vy>0&&py+16<=q.y&&p.y+16>=q.y&&p.x>q.x-12&&p.x<q.x+q.w+12){ p.vy=-600; p.y=q.y-16; g.beep(520,.05,'triangle'); g.burst(p.x,q.y,'#ffffff',5,70); if(q.type==='frag') q.dead=true; } }
    if(p.y<280){ const d=280-p.y; p.y=280; maxH+=d; for(const q of plats) q.y+=d; top+=d; }
    plats=plats.filter(q=>q.y<680&&!(q.dead&&q.y>640)); const gapY=Math.min(125,70+maxH/250);
    while(top>-60){ top-=gapY; plats.push(mk(top)); }
    g.score=Math.floor(maxH/10); if(p.y>660){ g.beep(110,.4,'sawtooth'); g.over(); } },
  draw(c,g){ const k=Math.min(1,maxH/9000); c.fillStyle=Kit.grad(c,0,0,0,640,k>.5?'#070b1f':'#1d3f7a',k>.5?'#1a2a5c':'#5aa0d8',k>.5?'#3a5a9c':'#bfe3f5'); c.fillRect(0,0,420,640);
    if(k>.3){ c.globalAlpha=Math.min(1,(k-.3)*2); Kit.stars(c,420,640,0,50); c.globalAlpha=1; }
    for(let i=0;i<5;i++){ const yy=((i*170+maxH*.25)%850)-100; Kit.cloud(c,(i*113)%380,yy,1.300,'rgba(255,255,255,.16)'); }
    c.fillStyle='rgba(20,40,70,.5)'; c.beginPath(); c.moveTo(0,640); for(let x=0;x<=420;x+=42) c.lineTo(x,600+maxH*.12-Math.abs(Math.sin(x*.03))*90); c.lineTo(420,640+maxH); c.fill();
    for(const q of plats){ if(q.dead) continue; const col=q.type==='move'?'#ffe08a':q.type==='frag'?'#d9c6ad':'#ffffff';
      c.fillStyle='rgba(0,0,0,.18)'; c.beginPath(); c.roundRect(q.x+3,q.y+6,q.w,12,6); c.fill();
      c.fillStyle=col; c.beginPath(); c.roundRect(q.x,q.y,q.w,13,6.500); c.fill(); c.beginPath(); c.arc(q.x+16,q.y+1,10,0,7); c.arc(q.x+38,q.y-3,13,0,7); c.arc(q.x+60,q.y+1,10,0,7); c.fill();
      c.fillStyle='rgba(120,150,190,.3)'; c.beginPath(); c.roundRect(q.x+4,q.y+8,q.w-8,5,3); c.fill();
      if(q.type==='frag'){ c.strokeStyle='#8a745c'; c.lineWidth=1.500; c.beginPath(); c.moveTo(q.x+28,q.y-8); c.lineTo(q.x+34,q.y); c.lineTo(q.x+30,q.y+6); c.lineTo(q.x+38,q.y+12); c.stroke(); }
      if(q.type==='move'){ c.fillStyle='#f5b524'; c.beginPath(); c.moveTo(q.x+q.w+3,q.y+6); c.lineTo(q.x+q.w+10,q.y+1); c.lineTo(q.x+q.w+10,q.y+11); c.fill(); c.beginPath(); c.moveTo(q.x-3,q.y+6); c.lineTo(q.x-10,q.y+1); c.lineTo(q.x-10,q.y+11); c.fill(); } }
    hopper(c,p.x,p.y,p.vy,p.vx); }
});
})();
</script>
</body>
</html>
