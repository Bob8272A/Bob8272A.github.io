<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>Cloud Hop</title>
</head>
<body>
<script src="../../assets/kit.js"></script>
<script>
(function () {
const MODE={easy:.8,normal:1,hard:1.25};
let p, plats, foes, items, top, maxH, bonus, jet, shield, deadT;
function mk(y,g){ const d=Math.min(1,maxH/7000)*MODE[g.mode], t=Math.random(); const q={x:Kit.rnd(8,332),y,w:80,type:t<.1+d*.14?'move':t<.18+d*.3?'frag':t<.24+d*.3?'spring':'ok',vx:Kit.rnd(50,120)*(Math.random()<.5?-1:1),dead:false,sq:0};
  if(Math.random()<.3) items.push({x:q.x+40,y:y-26,type:Math.random()<.86?'coin':Math.random()<.5?'jet':'shield',on:q});
  if(maxH>900&&Math.random()<.07+d*.1) foes.push({x:Kit.rnd(40,380),y:y-40,vx:Kit.rnd(30,80)*(Math.random()<.5?-1:1)*(1+d)});
  return q; }
function hopper(c,x,y,vy,vx,jt){ const st=Kit.clamp(vy/900,-.25,.25); c.save(); c.translate(x,y); c.scale(1-st*.5,1+st*.5);
  if(jt){ c.fillStyle=Kit.grad(c,0,14,0,44,'#fff3b0','#ff8a52','rgba(226,54,44,0)'); c.beginPath(); c.moveTo(-8,12); c.lineTo(0,30+Math.random()*16); c.lineTo(8,12); c.fill(); c.fillStyle='#8a939a'; c.beginPath(); c.roundRect(-13,-2,6,18,3); c.roundRect(7,-2,6,18,3); c.fill(); }
  c.fillStyle='#ffb347'; c.beginPath(); c.ellipse(-8,15,6,3.5,0,0,7); c.ellipse(8,15,6,3.5,0,0,7); c.fill();
  c.fillStyle=Kit.rgrad(c,-5,-6,22,'#8ff0c4','#2fb37c'); c.beginPath(); c.arc(0,0,16,0,7); c.fill(); c.fillStyle='#d8fbe9'; c.beginPath(); c.ellipse(0,6,9,7,0,0,7); c.fill();
  c.fillStyle='#2fb37c'; c.beginPath(); c.moveTo(-3,-15); c.lineTo(0,-24); c.lineTo(3,-15); c.fill(); c.fillStyle='#f5b524'; c.beginPath(); c.arc(0,-25,3,0,7); c.fill();
  const lx=Kit.clamp(vx/200,-1,1)*2; c.fillStyle='#fff'; c.beginPath(); c.arc(-6,-4,5,0,7); c.arc(6,-4,5,0,7); c.fill(); c.fillStyle='#13241c'; c.beginPath(); c.arc(-6+lx,-4+(vy>0?1.5:-1),2.4,0,7); c.arc(6+lx,-4+(vy>0?1.5:-1),2.4,0,7); c.fill();
  c.strokeStyle='#13241c'; c.lineWidth=1.5; c.beginPath(); if(vy>300) c.arc(0,5,3,0,7); else c.arc(0,3,4,.2,2.94); c.stroke(); c.restore(); }
Kit.game({ id:'cloud-hop', title:'Cloud Hop', w:420, h:640, unit:'Height', pad:'lr',
  modes:[['normal','Normal'],['easy','Easy'],['hard','Hard']],
  help:'Bounce from cloud to cloud and climb. Springs launch you, cracked clouds break, storm clouds zap you unless you land on top of them. Jetpacks and shield bubbles help.',
  keys:[['Steer','← → / A D / hold a side of the screen'],['Wrap around','Leave one edge, appear on the other']],
  start(g){ p={x:210,y:520,vx:0,vy:-600}; foes=[]; items=[]; maxH=0; bonus=0; jet=0; shield=false; deadT=0; plats=[{x:170,y:580,w:80,type:'ok',sq:0}]; top=580; while(top>-60){ top-=72; plats.push(mk(top,g)); } },
  update(dt,g){ if(deadT>0){ deadT-=dt; p.vy+=1300*dt; p.y+=p.vy*dt; if(deadT<=0) g.over(); return; }
    let ax=0; if(g.left) ax=-1; else if(g.right) ax=1; else if(g.ptr.down) ax=g.ptr.x<210?-1:1;
    p.vx+=(ax*340-p.vx)*Math.min(1,dt*10); p.x+=p.vx*dt; if(p.x<-15)p.x=435; if(p.x>435)p.x=-15;
    const py=p.y; if(jet>0){ jet-=dt; p.vy=-760; if(Math.random()<.6) g.burst(p.x,p.y+18,['#fff3b0','#ff8a52'],1,40,{grav:200,life:.3}); } else p.vy+=1150*dt; p.y+=p.vy*dt;
    for(const q of plats){ q.sq=Math.max(0,q.sq-dt*5); if(q.type==='move'){ q.x+=q.vx*dt; if(q.x<0||q.x>420-q.w) q.vx*=-1; }
      if(!q.dead&&p.vy>0&&py+16<=q.y+2&&p.y+16>=q.y&&p.x>q.x-12&&p.x<q.x+q.w+12){ p.y=q.y-16; q.sq=1;
        if(q.type==='spring'){ p.vy=-980; g.sfx('power'); g.burst(p.x,q.y,'#ff8ab0',10,120); } else { p.vy=-610; g.sfx('bounce'); g.burst(p.x,q.y,'#ffffff',5,70,{round:true}); }
        if(q.type==='frag'){ q.dead=true; g.burst(q.x+40,q.y,'#d9c6ad',12,120); g.sfx('thud'); } } }
    for(const f of foes){ f.x+=f.vx*dt; if(f.x<30||f.x>390) f.vx*=-1; if(f.dead) continue; const dx=Math.abs(p.x-f.x), dy=p.y-f.y;
      if(dx<34&&Math.abs(dy)<28){ if(p.vy>0&&py<f.y-10||jet>0){ f.dead=true; bonus+=60; if(jet<=0) p.vy=-640; g.sfx('hit'); g.burst(f.x,f.y,['#5a6478','#ffe14a'],18,200); g.pop(f.x,f.y-20,'+60'); }
        else if(shield){ shield=false; f.dead=true; g.sfx('hit'); g.burst(f.x,f.y,'#7fd0ff',18,200); g.pop(f.x,f.y-20,'Shield used','#7fd0ff'); }
        else { deadT=1; p.vy=-300; g.sfx('boom'); g.shake(12); g.burst(p.x,p.y,'#ffe14a',22,240); return; } } }
    for(const k of items){ if(k.on&&!k.on.dead){ k.x=k.on.x+40; k.y=k.on.y-26; } if(Math.abs(k.x-p.x)<26&&Math.abs(k.y-p.y)<28){ k.dead=true;
        if(k.type==='coin'){ bonus+=20; g.sfx('coin'); g.burst(k.x,k.y,'#f5c531',8); g.pop(k.x,k.y-14,'+20'); } else if(k.type==='jet'){ jet=2.2; g.sfx('power'); g.pop(k.x,k.y-14,'JETPACK!','#ff8a52'); } else { shield=true; g.sfx('power'); g.pop(k.x,k.y-14,'SHIELD','#7fd0ff'); } } }
    if(p.y<270){ const d=270-p.y; p.y=270; maxH+=d; top+=d; for(const q of plats) q.y+=d; for(const f of foes) f.y+=d; for(const k of items) k.y+=d; }
    plats=plats.filter((q)=>q.y<700&&!(q.dead&&q.sq<=0)); foes=foes.filter((f)=>f.y<700&&!f.dead); items=items.filter((k)=>k.y<700&&!k.dead&&!(k.on&&k.on.dead));
    const gapY=Math.min(128,72+maxH/220*MODE[g.mode]); while(top>-70){ top-=gapY; plats.push(mk(top,g)); }
    g.score=Math.floor(maxH/10)+bonus; g.stats=[['Climbed',Math.floor(maxH/10)+' m']];
    if(p.y>670){ if(shield){ shield=false; p.vy=-1050; g.sfx('power'); g.pop(p.x,600,'Saved by shield!','#7fd0ff'); } else { g.sfx('whoosh'); g.over('You fell'); } } },
  draw(c,g){ const k=Math.min(1,maxH/9000); c.fillStyle=k<.35?Kit.grad(c,0,0,0,640,'#1d4f8f','#5aa0d8','#bfe3f5'):k<.7?Kit.grad(c,0,0,0,640,'#2a1a4a','#8a4a7a','#f0a070'):Kit.grad(c,0,0,0,640,'#04060f','#0c1230','#1a2a5c'); c.fillRect(0,0,420,640);
    if(k>.3){ c.globalAlpha=Math.min(1,(k-.3)*2); Kit.stars(c,420,640,g.t*.1,60); c.globalAlpha=1; }
    if(k>.7){ c.fillStyle=Kit.rgrad(c,300,150,60,'#f0c070','#a05a30'); c.beginPath(); c.arc(310,160,36,0,7); c.fill(); c.strokeStyle='rgba(240,220,180,.6)'; c.lineWidth=4; c.beginPath(); c.ellipse(310,160,60,12,-.3,0,7); c.stroke(); }
    else { c.fillStyle='rgba(255,244,194,.9)'; c.beginPath(); c.arc(340,90+maxH*.01,30,0,7); c.fill(); }
    for(let i=0;i<5;i++) Kit.cloud(c,(i*113)%380,((i*170+maxH*.25)%850)-100,1.3,'rgba(255,255,255,.14)');
    if(maxH<3000){ c.fillStyle='rgba(20,40,70,.5)'; c.beginPath(); c.moveTo(0,640+maxH*.2); for(let x=0;x<=420;x+=42) c.lineTo(x,600+maxH*.2-Math.abs(Math.sin(x*.03))*90); c.lineTo(420,640+maxH*.2); c.fill(); }
    for(const q of plats){ const col=q.type==='move'?'#ffe08a':q.type==='frag'?'#d9c6ad':q.type==='spring'?'#ffd3e2':'#ffffff', yy=q.y+q.sq*4; if(q.dead) continue;
      c.fillStyle='rgba(0,0,0,.18)'; c.beginPath(); c.roundRect(q.x+3,yy+6,q.w,12,6); c.fill();
      c.fillStyle=col; c.beginPath(); c.roundRect(q.x,yy,q.w,13,6.5); c.fill(); c.beginPath(); c.arc(q.x+16,yy+1,10,0,7); c.arc(q.x+38,yy-3,13,0,7); c.arc(q.x+60,yy+1,10,0,7); c.fill();
      c.fillStyle='rgba(120,150,190,.3)'; c.beginPath(); c.roundRect(q.x+4,yy+8,q.w-8,5,3); c.fill();
      if(q.type==='frag'){ c.strokeStyle='#8a745c'; c.lineWidth=1.5; c.beginPath(); c.moveTo(q.x+28,yy-8); c.lineTo(q.x+34,yy); c.lineTo(q.x+30,yy+6); c.lineTo(q.x+38,yy+12); c.stroke(); }
      if(q.type==='spring'){ const h=12-q.sq*7; c.strokeStyle='#8a939a'; c.lineWidth=2.5; c.beginPath(); for(let i=0;i<=4;i++) c.lineTo(q.x+40+(i%2?6:-6),yy-12-h+i*(h/4)+h); c.stroke(); c.fillStyle='#e2362c'; c.beginPath(); c.roundRect(q.x+28,yy-16-h,24,6,3); c.fill(); }
      if(q.type==='move'){ c.fillStyle='#f5b524'; for(const s of [-1,1]){ const ex=s>0?q.x+q.w+3:q.x-3; c.beginPath(); c.moveTo(ex,yy+6); c.lineTo(ex+s*7,yy+1); c.lineTo(ex+s*7,yy+11); c.fill(); } } }
    for(const it of items){ const b=Math.sin(g.t*4+it.x)*3; if(it.type==='coin') Kit.coin(c,it.x,it.y+b,9,g.t+it.x);
      else if(it.type==='jet'){ c.fillStyle='#8a939a'; c.beginPath(); c.roundRect(it.x-9,it.y-12+b,7,20,3); c.roundRect(it.x+2,it.y-12+b,7,20,3); c.fill(); c.fillStyle='#e2362c'; c.fillRect(it.x-9,it.y-12+b,7,5); c.fillRect(it.x+2,it.y-12+b,7,5); c.fillStyle='#ff8a52'; c.beginPath(); c.moveTo(it.x-8,it.y+8+b); c.lineTo(it.x-5.5,it.y+15+b); c.lineTo(it.x-3,it.y+8+b); c.moveTo(it.x+3,it.y+8+b); c.lineTo(it.x+5.5,it.y+15+b); c.lineTo(it.x+8,it.y+8+b); c.fill(); }
      else { c.strokeStyle='#7fd0ff'; c.lineWidth=2.5; c.fillStyle='rgba(127,208,255,.25)'; c.beginPath(); c.arc(it.x,it.y+b,11,0,7); c.fill(); c.stroke(); c.fillStyle='rgba(255,255,255,.8)'; c.beginPath(); c.arc(it.x-4,it.y-4+b,2.5,0,7); c.fill(); } }
    for(const f of foes){ Kit.cloud(c,f.x-26,f.y+4,1.25,'#4a5468'); Kit.cloud(c,f.x-24,f.y+1,1.1,'#5f6b82'); c.fillStyle='#fff'; c.beginPath(); c.arc(f.x-9,f.y-2,5,0,7); c.arc(f.x+9,f.y-2,5,0,7); c.fill(); c.fillStyle='#10131a'; c.beginPath(); c.arc(f.x-8,f.y-1,2.2,0,7); c.arc(f.x+10,f.y-1,2.2,0,7); c.fill(); c.strokeStyle='#10131a'; c.lineWidth=2; c.beginPath(); c.moveTo(f.x-15,f.y-9); c.lineTo(f.x-5,f.y-6); c.moveTo(f.x+15,f.y-9); c.lineTo(f.x+5,f.y-6); c.stroke();
      if(Math.sin(g.t*9+f.x)>.3){ c.strokeStyle='#ffe14a'; c.lineWidth=2.5; c.beginPath(); c.moveTo(f.x-4,f.y+16); c.lineTo(f.x+3,f.y+24); c.lineTo(f.x-2,f.y+24); c.lineTo(f.x+4,f.y+34); c.stroke(); } }
    c.save(); if(deadT>0){ c.translate(p.x,p.y); c.rotate((1-deadT)*9); c.translate(-p.x,-p.y); } hopper(c,p.x,p.y,p.vy,p.vx,jet>0); c.restore();
    if(shield){ c.strokeStyle='rgba(127,208,255,.9)'; c.lineWidth=2.5; c.fillStyle='rgba(127,208,255,.14)'; c.beginPath(); c.arc(p.x,p.y-2,25,0,7); c.fill(); c.stroke(); }
    Kit.text(c,Math.floor(maxH/10)+' m',12,28,17,'#f3f2ec'); if(jet>0) Kit.bar(c,150,14,120,12,jet/2.2,'#ff8a52'); }
});
})();
</script>
</body>
</html>
