<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>Sky Stack</title>
</head>
<body>
<script src="../../assets/kit.js"></script>
<script>
(function () {
const BH=30, MODE={normal:[170,6],fast:[250,9]};
let stack, cur, dir, cam, bits, perfect, sway, best;
function floor(c,x,y,w,i,roof){ const hue=(i*14+200)%360; c.fillStyle='rgba(0,0,0,.3)'; c.fillRect(x+4,y+4,w,BH-2);
  c.fillStyle=Kit.grad(c,x,0,x+w,0,`hsl(${hue},45%,62%)`,`hsl(${hue},45%,48%)`); c.fillRect(x,y,w,BH-2); c.fillStyle=`hsl(${hue},40%,36%)`; c.fillRect(x,y+BH-6,w,4); c.fillStyle='rgba(255,255,255,.25)'; c.fillRect(x,y,w,2);
  for(let wx=x+7;wx<x+w-12;wx+=17){ const lit=(Math.floor(wx-x)*7+i*13)%5<3; c.fillStyle=lit?'#ffe9a8':'#22344d'; c.fillRect(wx,y+6,10,14); c.fillStyle='rgba(0,0,0,.2)'; c.fillRect(wx+4.5,y+6,1,14); if(lit&&(i+Math.floor(wx))%4===0){ c.fillStyle='#3a2414'; c.fillRect(wx+3,y+13,4,7); } }
  if(roof){ c.fillStyle='#39434e'; c.fillRect(x+w/2-1,y-14,2,14); c.fillStyle='#e2362c'; c.beginPath(); c.arc(x+w/2,y-15,2.5,0,7); c.fill(); } }
function drop(g){ const top=stack[stack.length-1]; const l=Math.max(cur.x,top.x), r=Math.min(cur.x+cur.w,top.x+top.w), y=600-(stack.length+1)*BH;
  if(r-l<=3){ bits.push({x:cur.x,y,w:cur.w,vy:0,vr:Kit.rnd(-2,2),a:0,i:stack.length}); cur.w=0; g.sfx('boom'); g.shake(10); return g.over('Missed!'); }
  const exact=Math.abs(cur.x-top.x)<6; let nb;
  if(exact){ perfect++; nb={x:top.x,w:top.w}; if(perfect>=3){ nb.w=Math.min(220,nb.w+14); nb.x=Kit.clamp(top.x-7,0,480-nb.w); g.pop(240,y-cam-10,'Perfect x'+perfect+'  wider!','#7fd0ff',16); } else g.pop(240,y-cam-10,'Perfect!','#fff3b0',16);
    g.tone(520+perfect*90,0,.16,'triangle',.09); g.burst(nb.x+nb.w/2,y+BH+cam,'#fff3b0',18,200); g.score+=1; }
  else { perfect=0; nb={x:l,w:r-l}; const cutL=cur.x<top.x; bits.push({x:cutL?cur.x:r,y,w:cur.w-(r-l),vy:0,vr:(cutL?-1:1)*Kit.rnd(1,2.4),a:0,i:stack.length,vx:(cutL?-1:1)*40}); g.sfx('thud'); g.shake(3); }
  stack.push(nb); g.score++; sway=1; cur={x:dir>0?-nb.w:480,w:nb.w}; dir=-dir;
  if(stack.length%10===1&&stack.length>2){ g.sfx('level'); g.banner((stack.length-1)+' floors!','',1); } }
Kit.game({ id:'sky-stack', title:'Sky Stack', w:480, h:640, unit:'Score', btns:[['Space','DROP']],
  modes:[['normal','Normal'],['fast','Fast crane']],
  help:'Drop each floor on top of the tower. Anything hanging over the edge is sliced off, so the tower narrows. A perfect drop scores double, and three perfect drops in a row widen the tower again.',
  keys:[['Drop the floor','Space / click / tap'],['Pause','P or Esc']],
  start(g){ stack=[{x:140,w:200}]; cur={x:-200,w:200}; dir=1; cam=0; bits=[]; perfect=0; sway=0; },
  tap(x,y,g){ drop(g); }, key(c,g){ if(c==='Space'||c==='ArrowDown') drop(g); },
  update(dt,g){ const [s0,inc]=MODE[g.mode], s=Math.min(520,s0+(stack.length-1)*inc); cur.x+=dir*s*dt; if(cur.x>480-cur.w*.4) dir=-1; if(cur.x<-cur.w*.6) dir=1;
    cam+=(Math.max(0,(stack.length-9)*BH)-cam)*Math.min(1,dt*5); sway=Math.max(0,sway-dt*2);
    for(const b of bits){ b.vy+=1300*dt; b.y+=b.vy*dt; b.x+=(b.vx||0)*dt; b.a+=b.vr*dt; } bits=bits.filter((b)=>b.y<900+cam);
    g.stats=[['Floors',stack.length-1]]; },
  draw(c,g){ const h=stack.length, k=Math.min(1,h/40); c.fillStyle=k<.4?Kit.grad(c,0,0,0,640,'#3f7fc4','#9fd0ee','#f6dfb8'):k<.8?Kit.grad(c,0,0,0,640,'#2a2a6a','#c06a8a','#f6b878'):Kit.grad(c,0,0,0,640,'#04060f','#10183c','#2a3a7c'); c.fillRect(0,0,480,640);
    if(k>=.8) Kit.stars(c,480,500,0,60); c.fillStyle=k>=.8?'#e9e4d0':'#fff4c2'; c.beginPath(); c.arc(390,110+cam*.05,30,0,7); c.fill();
    for(let i=0;i<6;i++) Kit.cloud(c,(i*97+g.t*(6+i*2))%600-80,((i*150+cam*.5)%760)-60,1+(i%2)*.4,k>=.8?'rgba(160,180,230,.3)':'rgba(255,255,255,.75)');
    c.fillStyle='rgba(40,60,90,.4)'; for(let i=0;i<8;i++){ const bh=110+(i*53)%120; c.fillRect(i*64-10,600-bh+cam*.4,58,600); c.fillStyle='rgba(255,230,160,.25)'; for(let wy=600-bh+cam*.4+10;wy<640;wy+=18) for(let wx=i*64-2;wx<i*64+40;wx+=14) if((wx+Math.floor(wy/18))%3) c.fillRect(wx,wy,6,8); c.fillStyle='rgba(40,60,90,.4)'; }
    c.fillStyle='#4a5a48'; c.fillRect(0,600+cam,480,80); c.fillStyle='#39434e'; c.fillRect(0,600+cam,480,6); for(let i=0;i<5;i++) Kit.tree(c,30+i*105,596+cam,.8);
    const lean=Math.sin(g.t*3)*sway*2; stack.forEach((b,i)=>floor(c,b.x+lean*(i/h),600-(i+1)*BH+cam,b.w,i));
    for(const b of bits){ c.save(); c.translate(b.x+b.w/2,b.y+cam+BH/2); c.rotate(b.a); floor(c,-b.w/2,-BH/2,b.w,b.i); c.restore(); }
    c.fillStyle='#f5b524'; c.fillRect(0,0,480,10); c.fillStyle='#1b1404'; for(let x=(g.t*30)%24-24;x<480;x+=24){ c.beginPath(); c.moveTo(x,10); c.lineTo(x+10,0); c.lineTo(x+18,0); c.lineTo(x+8,10); c.fill(); }
    if(cur.w>0){ const cy=600-(h+1)*BH+cam, mid=cur.x+cur.w/2; c.fillStyle='#39434e'; c.fillRect(mid-9,8,18,10); c.strokeStyle='#39434e'; c.lineWidth=3; c.beginPath(); c.moveTo(mid,16); c.lineTo(mid,cy-14); c.stroke(); c.lineWidth=2; c.beginPath(); c.moveTo(mid,cy-14); c.lineTo(cur.x+6,cy); c.moveTo(mid,cy-14); c.lineTo(cur.x+cur.w-6,cy); c.stroke();
      const top=stack[h-1]; c.fillStyle='rgba(255,255,255,.12)'; c.fillRect(top.x,cy+BH-2,top.w,2); c.strokeStyle='rgba(255,255,255,.25)'; c.setLineDash([4,6]); c.lineWidth=1; c.beginPath(); c.moveTo(top.x,cy-30); c.lineTo(top.x,cy+BH); c.moveTo(top.x+top.w,cy-30); c.lineTo(top.x+top.w,cy+BH); c.stroke(); c.setLineDash([]);
      floor(c,cur.x,cy,cur.w,h,true); }
    Kit.text(c,(h-1)+'',240,70,40,'#ffffff','center'); Kit.text(c,'FLOORS',240,88,10,'rgba(255,255,255,.8)','center'); if(perfect>0) Kit.text(c,'Perfect streak '+perfect,240,110,13,'#7fd0ff','center'); }
});
})();
</script>
</body>
</html>
