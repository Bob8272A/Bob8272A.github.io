<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>Star Guard</title>
</head>
<body>
<script src="../../assets/kit.js"></script>
<script>
(function () {
let px, foes, shots, bombs, dir, cool, wave, step;
function mkWave(){ foes=[]; for(let r=0;r<4;r++)for(let c=0;c<8;c++) foes.push({x:60+c*46,y:60+r*38,r}); dir=1; }
Kit.game({ id:'star-guard', title:'Star Guard', w:480, h:600, help:'Move with the arrow keys, A/D or the mouse. Space or hold click to fire. Stop the swarm before it lands.',
  start(){ px=240; shots=[]; bombs=[]; cool=0; wave=1; mkWave(); },
  update(dt,g){ if(g.left) px-=300*dt; else if(g.right) px+=300*dt; else if(g.ptr.down) px+=(g.ptr.x-px)*Math.min(1,dt*14); px=Kit.clamp(px,20,460); cool-=dt;
    if((g.key('Space')||g.ptr.down)&&cool<=0){ cool=.32; shots.push({x:px,y:548}); g.beep(700,.04); }
    const sp=(22+wave*8)+(32-foes.length)*3.2; let edge=false;
    for(const f of foes){ f.x+=dir*sp*dt; if(f.x>456||f.x<24) edge=true; }
    if(edge){ dir=-dir; for(const f of foes){ f.y+=16; f.x+=dir*4; } }
    if(Math.random()<dt*(.6+wave*.25)&&foes.length){ const f=Kit.pick(foes); bombs.push({x:f.x,y:f.y+10}); }
    for(const b of shots){ b.y-=520*dt; for(const f of foes) if(!f.dead&&Math.abs(b.x-f.x)<16&&Math.abs(b.y-f.y)<13){ f.dead=true; b.y=-99; g.score+=10+(3-f.r)*5; g.beep(260,.07,'sawtooth'); break; } }
    for(const b of bombs){ b.y+=(190+wave*20)*dt; if(Math.abs(b.x-px)<20&&b.y>548&&b.y<574){ g.beep(90,.5,'sawtooth'); return g.over(); } }
    foes=foes.filter(f=>!f.dead); shots=shots.filter(b=>b.y>-10); bombs=bombs.filter(b=>b.y<610);
    if(foes.some(f=>f.y>530)) return g.over('They landed'); if(!foes.length){ wave++; g.score+=50; mkWave(); } },
  draw(c,g){ for(let i=0;i<40;i++){ c.fillStyle='#2a3440'; c.fillRect((i*97)%480,(i*61+g.t*20)%600,2,2); }
    for(const f of foes){ c.fillStyle=['#e2362c','#f08a52','#f5b524','#4fc3f7'][f.r]; const w=Math.sin(g.t*6+f.x*.1)>0?4:0; c.beginPath(); c.moveTo(f.x,f.y-12); c.lineTo(f.x+15,f.y+2+w); c.lineTo(f.x+7,f.y+10); c.lineTo(f.x-7,f.y+10); c.lineTo(f.x-15,f.y+2+w); c.closePath(); c.fill(); c.fillStyle='#0b0f14'; c.fillRect(f.x-6,f.y-2,4,4); c.fillRect(f.x+2,f.y-2,4,4); }
    c.fillStyle='#f3f2ec'; for(const b of shots) c.fillRect(b.x-2,b.y-8,4,12); c.fillStyle='#e2362c'; for(const b of bombs) c.fillRect(b.x-3,b.y-6,6,12);
    c.fillStyle='#3fb374'; c.beginPath(); c.moveTo(px,546); c.lineTo(px+20,574); c.lineTo(px-20,574); c.closePath(); c.fill(); }
});
})();
</script>
</body>
</html>
