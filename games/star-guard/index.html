<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>Star Guard</title>
</head>
<body>
<script src="../../assets/kit.js"></script>
<script>
(function () {
let px, foes, shots, bombs, dir, cool, wave, step;
function mkWave(){ foes=[]; for(let r=0;r<4;r++)for(let c=0;c<8;c++) foes.push({x:60+c*46,y:60+r*38,r}); dir=1; }
function bug(c,x,y,row,t){ const cols=[['#ff5a6a','#a81f3a'],['#ffa04a','#b3541a'],['#ffd84a','#b08a10'],['#5fd0ff','#1f6fa8']][row], w=Math.sin(t*6+x*.1)>0; c.save(); c.translate(x,y);
  c.strokeStyle=cols[1]; c.lineWidth=2.500; c.lineCap='round'; for(const sx of [-1,1]){ c.beginPath(); c.moveTo(sx*8,6); c.lineTo(sx*(w?15:12),w?13:15); c.moveTo(sx*4,8); c.lineTo(sx*(w?5:7),15); c.stroke(); c.beginPath(); c.moveTo(sx*5,-9); c.lineTo(sx*9,-16); c.stroke(); c.fillStyle=cols[0]; c.beginPath(); c.arc(sx*9,-17,2.200,0,7); c.fill(); }
  c.fillStyle=Kit.grad(c,0,-12,0,10,cols[0],cols[1]); c.beginPath(); c.ellipse(0,0,14,11,0,0,7); c.fill(); c.fillStyle='rgba(255,255,255,.3)'; c.beginPath(); c.ellipse(-4,-6,6,2.500,-.3,0,7); c.fill();
  if(row%2){ c.fillStyle='#fff'; c.beginPath(); c.arc(0,-1,6,0,7); c.fill(); c.fillStyle='#10131a'; c.beginPath(); c.arc(0,0,3,0,7); c.fill(); }
  else { c.fillStyle='#fff'; c.beginPath(); c.arc(-5,-1,4,0,7); c.arc(5,-1,4,0,7); c.fill(); c.fillStyle='#10131a'; c.beginPath(); c.arc(-5,0,2,0,7); c.arc(5,0,2,0,7); c.fill(); }
  c.fillStyle='#10131a'; c.fillRect(-4,6,8,2); c.restore(); }
Kit.game({ id:'star-guard', title:'Star Guard', w:480, h:600, help:'Move with the arrow keys, A/D or the mouse. Space or hold click to fire. Stop the swarm before it lands.',
  start(){ px=240; shots=[]; bombs=[]; cool=0; wave=1; mkWave(); },
  update(dt,g){ if(g.left) px-=300*dt; else if(g.right) px+=300*dt; else if(g.ptr.down) px+=(g.ptr.x-px)*Math.min(1,dt*14); px=Kit.clamp(px,20,460); cool-=dt;
    if((g.key('Space')||g.ptr.down)&&cool<=0){ cool=.32; shots.push({x:px,y:548}); g.beep(700,.04); }
    const sp=(22+wave*8)+(32-foes.length)*3.2; let edge=false;
    for(const f of foes){ f.x+=dir*sp*dt; if(f.x>456||f.x<24) edge=true; }
    if(edge){ dir=-dir; for(const f of foes){ f.y+=16; f.x+=dir*4; } }
    if(Math.random()<dt*(.6+wave*.25)&&foes.length){ const f=Kit.pick(foes); bombs.push({x:f.x,y:f.y+10}); }
    for(const b of shots){ b.y-=520*dt; for(const f of foes) if(!f.dead&&Math.abs(b.x-f.x)<16&&Math.abs(b.y-f.y)<13){ f.dead=true; b.y=-99; g.score+=10+(3-f.r)*5; g.beep(260,.07,'sawtooth'); g.burst(f.x,f.y,['#ff5a6a','#ffa04a','#ffd84a','#5fd0ff'][f.r],12); break; } }
    for(const b of bombs){ b.y+=(190+wave*20)*dt; if(Math.abs(b.x-px)<20&&b.y>548&&b.y<574){ g.beep(90,.5,'sawtooth'); g.burst(px,560,'#49c98f',26,240); g.shake(14); return g.over('Ship destroyed'); } }
    foes=foes.filter(f=>!f.dead); shots=shots.filter(b=>b.y>-10); bombs=bombs.filter(b=>b.y<610);
    if(foes.some(f=>f.y>530)) return g.over('They landed'); if(!foes.length){ wave++; g.score+=50; mkWave(); } },
  draw(c,g){ c.fillStyle=Kit.grad(c,0,0,0,600,'#0a0820','#14103a','#0b0f14'); c.fillRect(0,0,480,600); Kit.stars(c,480,600,g.t,70);
    c.fillStyle=Kit.rgrad(c,390,110,70,'#3fb3a0','#1b5a6a'); c.beginPath(); c.arc(400,120,44,0,7); c.fill(); c.fillStyle='rgba(0,0,0,.2)'; c.beginPath(); c.arc(412,108,9,0,7); c.arc(388,134,6,0,7); c.fill();
    for(const f of foes) bug(c,f.x,f.y,f.r,g.t);
    c.shadowColor='#7ef'; c.shadowBlur=10; c.fillStyle='#d8fbff'; for(const b of shots){ c.beginPath(); c.roundRect(b.x-2,b.y-10,4,14,2); c.fill(); } c.shadowColor='#f55'; c.fillStyle='#ff7a6a'; for(const b of bombs){ c.beginPath(); c.arc(b.x,b.y,4,0,7); c.fill(); c.fillRect(b.x-1,b.y-10,2,8); } c.shadowBlur=0;
    c.save(); c.translate(px,560); c.fillStyle=Kit.grad(c,0,14,0,30,'#fff3b0','rgba(240,138,82,0)'); c.beginPath(); c.moveTo(-6,14); c.lineTo(0,24+Math.random()*8); c.lineTo(6,14); c.fill();
    c.fillStyle='#2f8f6a'; c.beginPath(); c.moveTo(-22,14); c.lineTo(-8,-2); c.lineTo(-8,14); c.fill(); c.beginPath(); c.moveTo(22,14); c.lineTo(8,-2); c.lineTo(8,14); c.fill();
    c.fillStyle=Kit.grad(c,-9,0,9,0,'#c9f5df','#49c98f','#2f8f6a'); c.beginPath(); c.moveTo(0,-20); c.quadraticCurveTo(10,-4,9,14); c.lineTo(-9,14); c.quadraticCurveTo(-10,-4,0,-20); c.fill();
    c.fillStyle='#16283a'; c.beginPath(); c.ellipse(0,-4,4,6,0,0,7); c.fill(); c.fillStyle='rgba(255,255,255,.6)'; c.beginPath(); c.ellipse(-1,-6,1.500,2.500,0,0,7); c.fill(); c.fillStyle='#e2362c'; c.fillRect(-22,10,5,4); c.fillRect(17,10,5,4); c.restore(); }
});
})();
</script>
</body>
</html>
