<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Play · Off-Ramp Arcade</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 58 62'%3E%3Cpath d='M29 2C18 6 9 5 3 3 1 22 4 44 29 60 54 44 57 22 55 3 49 5 40 6 29 2Z' fill='%2300663f'/%3E%3Ctext x='29' y='42' text-anchor='middle' font-family='Arial' font-weight='900' font-size='24' fill='%23f3f2ec'%3E66%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Overpass:wght@400;600;800;900&family=Overpass+Mono:wght@500;700&display=swap">
<link rel="stylesheet" href="assets/style.css">
<link rel="stylesheet" href="assets/arcade.css">
</head>
<body>
<header class="top">
  <div class="wrap">
    <a class="logo" href="index.html" aria-label="Off-Ramp Arcade home">
      <span class="logo-sign"><span>Off-Ramp Arcade</span></span>
      <span class="logo-exit">EXIT 66</span>
    </a>
    <nav class="nav tabs" id="tabs" aria-label="Game genres"></nav>
  </div>
</header>

<main class="wrap">
  <div class="play-head">
    <div>
      <a class="crumb" id="crumb" href="index.html">← All games</a>
      <h1 id="title">Game not found</h1>
    </div>
    <div class="btns" id="btns">
      <button class="btn small" id="fsBtn" type="button">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg>
        Fullscreen
      </button>
      <a class="btn ghost small" id="newTab" target="_blank" rel="noopener">Open in new tab</a>
    </div>
  </div>

  <div class="stage" id="stage"></div>
  <p class="focus-hint" id="hint">If the keys stop responding, click once inside the game.</p>

  <div class="info" id="info"></div>

  <section class="more" aria-labelledby="moreTitle">
    <h2 id="moreTitle">More games</h2>
    <div class="grid" id="more"></div>
  </section>
</main>

<footer class="foot">
  <div class="wrap">
    <span>© <span id="yr"></span> Off-Ramp Arcade</span>
    <a href="index.html">All games</a>
  </div>
</footer>

<script src="assets/games.js"></script>
<script>
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const $ = (id) => document.getElementById(id);
const hrefOf = (g) => g.href || 'play.html?g=' + encodeURIComponent(g.slug);
const artOf = (g) => g.img
  ? `<img src="${esc(g.img)}" alt="" loading="lazy">`
  : `<svg viewBox="0 0 160 90" preserveAspectRatio="xMidYMid slice" aria-hidden="true"><defs><linearGradient id="bg-${g.slug}" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="${g.bg[0]}"/><stop offset="1" stop-color="${g.bg[1]}"/></linearGradient></defs><rect width="160" height="90" fill="url(#bg-${g.slug})"/>${g.art}</svg>`;
const card = (g) => `<a class="card" href="${esc(hrefOf(g))}"><div class="card-art">${artOf(g)}</div><div class="card-body"><h3>${esc(g.title)}</h3><p>${esc(g.blurb)}</p></div></a>`;

const game = GAMES.find((g) => g.slug === new URLSearchParams(location.search).get('g') && !g.href);
$('tabs').innerHTML = ['Home', ...GENRES.filter((c) => GAMES.some((g) => g.genre === c))]
  .map((t) => `<a href="index.html#${t === 'Home' ? '' : t.toLowerCase()}"${game && game.genre === t ? ' aria-current="page"' : ''}>${t}</a>`).join('');
$('yr').textContent = new Date().getFullYear();

if (!game) {
  $('btns').hidden = $('stage').hidden = $('hint').hidden = true;
  $('info').innerHTML = '<section class="panel"><h2>Hmm</h2><p>That game is not in the arcade. Pick one from the list below.</p></section>';
  $('more').innerHTML = GAMES.slice(0, 8).map(card).join('');
} else {
  const src = 'games/' + game.slug + '/index.html';
  document.title = game.title + ' · Off-Ramp Arcade';
  $('title').textContent = game.title;
  $('crumb').textContent = '← ' + game.genre + ' games';
  $('crumb').href = 'index.html#' + game.genre.toLowerCase();
  $('newTab').href = src;
  const stage = $('stage');
  // Phones get a taller game window; the games scale themselves to fit it.
  if (matchMedia('(max-width: 820px)').matches) stage.style.aspectRatio = String(game.ratio || 0.75);
  const frame = document.createElement('iframe');
  frame.src = src; frame.title = game.title + ' game';
  frame.allow = 'fullscreen; autoplay; gamepad'; frame.setAttribute('allowfullscreen', '');
  stage.appendChild(frame);
  frame.addEventListener('load', () => frame.focus());
  stage.addEventListener('pointerdown', () => frame.focus());
  $('fsBtn').addEventListener('click', () => {
    const req = stage.requestFullscreen || stage.webkitRequestFullscreen;
    if (req) req.call(stage); else window.open(src, '_blank');
    setTimeout(() => frame.focus(), 300);
  });
  $('info').innerHTML =
    `<section class="panel"><h2>How to play</h2><p>${esc(game.how || game.blurb)}</p>${game.credit ? `<p class="credit">${esc(game.credit)}</p>` : ''}</section>` +
    `<section class="panel"><h2>Controls</h2><ul class="keys">${(game.keys || []).map(([a, b]) => `<li><span>${esc(a)}</span><span>${esc(b)}</span></li>`).join('')}</ul></section>`;
  const same = GAMES.filter((g) => g !== game && g.genre === game.genre), rest = GAMES.filter((g) => g !== game && g.genre !== game.genre);
  $('more').innerHTML = [...same, ...rest].slice(0, 8).map(card).join('');
}
</script>
</body>
</html>
